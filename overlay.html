<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>キルチャレ・OBS表示</title>
<style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:#b95783;font-family:"Arial Rounded MT Bold","Hiragino Maru Gothic ProN",system-ui,sans-serif;padding:12px;font-weight:800}
.board{max-width:870px}.gauge{height:96px;padding:8px;border:5px solid white;border-radius:60px;box-shadow:0 0 0 2px #f3b8d3;background:#ffe8f3;position:relative;overflow:hidden}
.track{height:100%;background:#fffafd;border-radius:40px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#faaaCE,#ee80b1);transition:width .25s ease}
.gauge-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding:0 30px;font-size:34px;gap:10px;text-shadow:2px 2px white,-2px -2px white,2px -2px white,-2px 2px white;font-variant-numeric:tabular-nums}
.panels{margin-top:22px;width:100%;max-width:600px;line-height:0}
.panel-art{display:block;width:100%;height:auto;overflow:hidden}
.panel-piece{fill:#ecc1ef;stroke:#a36bbe;stroke-width:11;stroke-linejoin:round}
.panel-label{fill:white;stroke:#9563ac;stroke-width:4;paint-order:stroke;stroke-linejoin:round;font-size:26px;text-anchor:middle}
.panel-count{fill:#090509;font-weight:500;font-size:72px;text-anchor:middle;stroke:none;font-variant-numeric:tabular-nums}
.panel-goal{fill:white;stroke:#9563ac;stroke-width:3;paint-order:stroke;font-size:27px;text-anchor:middle}
body[data-view="panels"]{padding:0}body[data-view="panels"] .board{max-width:none}body[data-view="panels"] .panels{max-width:none}
#notice{font-size:16px;color:#8b3058;background:#fff1f8;border-radius:10px;padding:8px;margin:12px 0 0;max-width:620px}#notice:empty{display:none}
body[data-view="gauge"] .panels{display:none}body[data-view="panels"] .gauge{display:none}body[data-view="panels"] .panels{margin-top:0}
</style>
</head><body>
<main class="board">
<div class="gauge" role="progressbar" aria-label="キル消化の進捗" id="killGauge" aria-valuemin="0">
<div class="track"><div class="fill" id="gaugeFill"></div></div>
<div class="gauge-label">キル <span id="converted">—</span> / <span id="quota">—</span></div>
</div>
<div class="panels"><svg class="panel-art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 780" aria-label="イラストを隠す9枚のパネル"><g id="panel0"><polygon class="panel-piece" points="0,0 200,0 202,25 225,220 0,315"/><text class="panel-label" style="font-size:26px" x="105" y="115">フルエール</text><text class="panel-count" id="p0" x="90" y="237">—</text><text class="panel-goal" x="155" y="157">/100</text></g><g id="panel1"><polygon class="panel-piece" points="200,0 540,0 540,170 202,25"/><text class="panel-label" style="font-size:26px" x="398" y="42">ゲーム好きな人</text><text class="panel-count" id="p1" style="font-size:50px" x="407" y="104">—</text><text class="panel-goal" x="500" y="101">/50</text></g><g id="panelAll"><polygon class="panel-piece" points="202,25 540,170 540,285 232,285 225,220"/><text class="panel-label" style="font-size:42px" x="377" y="221">全達成</text></g><g id="panel5"><polygon class="panel-piece" points="0,315 225,220 232,285 246,425 0,425"/><text class="panel-label" style="font-size:26px" x="121" y="339">スコアロック</text><text class="panel-count" id="p5" x="97" y="407">—</text><text class="panel-goal" x="180" y="394">/1</text></g><g id="panel6"><polygon class="panel-piece" points="232,285 540,285 540,370 246,425"/><text class="panel-label" style="font-size:18px" x="388" y="316">ランダム スターベイビー（大）</text><text class="panel-count" id="p6" x="338" y="379">—</text><text class="panel-goal" x="432" y="369">/1</text></g><g id="panel2"><polygon class="panel-piece" points="0,425 246,425 260,610 0,565"/><text class="panel-label" style="font-size:26px" x="124" y="462">ランダム</text><text class="panel-label" style="font-size:21px" x="124" y="492">スターベイビー（小）</text><text class="panel-count" id="p2" x="83" y="552">—</text><text class="panel-goal" x="185" y="531">/500</text></g><g id="panel3"><polygon class="panel-piece" points="246,425 540,370 540,565 260,610"/><text class="panel-label" style="font-size:26px" x="398" y="466">ランダム</text><text class="panel-label" style="font-size:21px" x="398" y="496">スターベイビー（中）</text><text class="panel-count" id="p3" x="345" y="565">—</text><text class="panel-goal" x="461" y="539">/150</text></g><g id="panel4"><polygon class="panel-piece" points="0,565 260,610 267,675 280,780 0,780"/><text class="panel-label" style="font-size:26px" x="135" y="647">プチ</text><text class="panel-label" style="font-size:26px" x="135" y="677">スターベイビー</text><text class="panel-count" id="p4" x="89" y="757">—</text><text class="panel-goal" x="198" y="722">/500</text></g><g id="panel7"><polygon class="panel-piece" points="260,610 540,565 540,780 280,780 267,675"/><text class="panel-label" style="font-size:26px" x="408" y="654">無料ギフト</text><text class="panel-count" id="p7" x="354" y="749">—</text><text class="panel-goal" x="470" y="721">/100</text></g></svg></div>
<p id="notice">接続中…</p>
</main>
<script src="firebase-config.js"></script><script src="overlay.js"></script>
</body></html>
